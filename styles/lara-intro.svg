<svg width="650" height="80" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line {
      font-size: 30px;
      font-family: "Inter", sans-serif;
      fill: #c7c7ff;
      animation: slide 5s infinite;
    }

    @keyframes slide {
      0% { transform: translateY(100%); opacity: 0; }
      20% { transform: translateY(0); opacity: 1; }
      70% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100%); opacity: 0; }
    }
  </style>

  <text x="0" y="35" class="line">Hello, I build things that matter...</text>
  <text x="0" y="70" class="line" style="animation-delay: 0.3s;">I'm Lara Kosta.</text>
</svg>
